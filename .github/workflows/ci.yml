# Tests THIS plugin inside the main repo (which has the core and the other plugins) and sends the analysis
# and coverage to this repo's SonarCloud project. The steps live in the main repo:
# PEI-aLinha/alinha/.github/workflows/plugin-ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # SonarCloud PR decoration

jobs:
  ci:
    # Coordinated change (alinha#26): test against the main repo's branch with the contract. A small PR sets this
    # back to @main, without main-ref, once that branch merges (as organization#22 / #23).
    uses: PEI-aLinha/alinha/.github/workflows/plugin-ci.yml@feat/26-traceability
    with:
      main-ref: feat/26-traceability
      plugin-path: plugins/feature/dashboard-reports
      gradle-project: dashboard-reports
      npm-package: "@alinha/plugin-dashboard-reports"
    secrets:
      ALINHA_READ_TOKEN: ${{ secrets.ALINHA_READ_TOKEN }}   # private repos only
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
