# Plugin manifest — keep in sync with DashboardReportsPlugin.kt (backend).
id: dashboard-reports
name: "Dashboard & Reports"
kind: feature
version: 0.1.0
# Where this repo lives as a submodule inside the main repo (PEI-aLinha/alinha)
path: plugins/feature/dashboard-reports
publishes: []     # events it publishes (e.g. AssessmentSubmitted)
consumes: []      # events it consumes
# RBAC resources. Which role gets each one lives only in DashboardReportsPlugin.kt (rolePermissions).
permissions:
  - portfolio:read   # the consultant's portfolio dashboard (#3), across every assigned client
